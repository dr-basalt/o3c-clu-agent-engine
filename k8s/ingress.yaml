apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: o3c-ingress
  namespace: o3c-agent-engine
  annotations:
    # Nginx Ingress Controller annotations
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"

    # Enable CORS for API
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, PATCH, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization,X-API-Key"

    # Rate limiting (adjust as needed)
    nginx.ingress.kubernetes.io/limit-rps: "100"

    # Cert-manager for automatic SSL (if using cert-manager)
    cert-manager.io/cluster-issuer: "letsencrypt-prod"

    # Cloudflare specific (if using Cloudflare)
    # external-dns.alpha.kubernetes.io/hostname: "your-domain.com"
    # external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
spec:
  ingressClassName: nginx  # or 'traefik' depending on your setup
  tls:
    - hosts:
        - your-domain.com  # Replace with your domain
        - api.your-domain.com
      secretName: o3c-tls-secret  # Automatically managed by cert-manager
  rules:
    - host: your-domain.com  # Replace with your domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: o3c-api-service
                port:
                  number: 80
    - host: api.your-domain.com  # API subdomain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: o3c-api-service
                port:
                  number: 80

---
# HorizontalPodAutoscaler for automatic scaling
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: o3c-api-hpa
  namespace: o3c-agent-engine
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: o3c-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 2
          periodSeconds: 30
      selectPolicy: Max
